services:
  - type: web
    name: sports-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CACHE_ENABLED
        value: "true"
      - key: THESPORTSDB_API_KEY
        value: "3"
